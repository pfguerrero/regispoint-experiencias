<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regis Point Concierge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#0B0B0B}
*{box-sizing:border-box}
button{font-family:inherit}
a{color:inherit}
img{display:block}
.btn{transition:transform .15s ease}
.tile{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.tile:hover{transform:translateY(-5px);border-color:#F2B544 !important;box-shadow:0 10px 28px rgba(242,181,68,0.18)}
.scr > div{padding-top:48px !important}
.btn:hover{transform:translateY(-2px)}
.card{transition:transform .25s ease}
.card:hover{transform:translateY(-6px)}
.pic{transition:transform .5s ease;filter:saturate(1.05) contrast(1.03) sepia(.08)}
.arch:hover .pic{transform:scale(1.05)}
a:focus-visible,button:focus-visible{outline:3px solid #F2B544;outline-offset:3px}
@media (max-width:820px){.navlinks{display:none !important}.herocol{padding-bottom:24px !important}.heroimg{display:none !important}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="width: 100%; font-family: 'Jost', system-ui, sans-serif; color: #F6EBD9; background: #0B0B0B">

<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<!-- HERO -->
<header style="position: relative; overflow: hidden; background: #0B0B0B">
<div style="position: absolute; left: -260px; top: -200px; width: 720px; height: 720px; border-radius: 50%; border: 2px solid rgba(246,235,217,0.1)"></div>
<div style="position: absolute; left: -160px; top: -100px; width: 520px; height: 520px; border-radius: 50%; border: 2px solid rgba(246,235,217,0.14)"></div>

<div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 28px 32px 0 32px">

<nav style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 16px 28px">
<div class="navlinks" style="display: flex; align-items: center; gap: 28px; font-size: 16px; font-weight: 500">
<a href="#" onClick="{{goTransfers}}" style="text-decoration: none; color: #F6EBD9">{{t.navTransfers}}</a>
<a href="#" onClick="{{goBeaches}}" style="text-decoration: none; color: #F6EBD9">{{t.tileBeaches}}</a>
<a href="#" onClick="{{goTours}}" style="text-decoration: none; color: #F6EBD9">{{t.navTours}}</a>
<a href="#" onClick="{{goCooking}}" style="text-decoration: none; color: #F6EBD9">{{t.navCooking}}</a>
<a href="#" onClick="{{goPackages}}" style="text-decoration: none; color: #F6EBD9">{{t.navPackages}}</a>
</div>
<a class="btn" href="#" onClick="{{goGuestCI}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 2.5px solid #F2B544; border-radius: 6px; color: #F6EBD9; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-decoration: none">{{t.tabGC}}</a>
<div style="display: flex; align-items: center; gap: 4px; padding: 4px; border: 1.5px solid rgba(246,235,217,0.4); border-radius: 999px">
<button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-height: 36px; min-width: 44px; border: 0; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; background: {{enBg}}; color: {{enFg}}">EN</button>
<button onClick="{{setEs}}" aria-pressed="{{isEs}}" style="min-height: 36px; min-width: 44px; border: 0; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; background: {{esBg}}; color: {{esFg}}">ES</button>
</div>
<a class="btn" href="#" onClick="{{goPlan}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: #F2B544; color: #0B0B0B; font-size: 16px; font-weight: 600; text-decoration: none">{{t.navPlan}}</a>
</div>
</nav>

<div id="top" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 48px; padding-top: 64px">

<div class="herocol" style="flex: 1 1 560px; min-width: 0; padding-bottom: 96px; display: flex; flex-direction: column; gap: 30px">
<div style="display: flex; align-items: center; gap: clamp(12px, 2vw, 26px); align-self: flex-start; max-width: 100%">
<div style="position: relative; flex: none; width: clamp(104px, 13vw, 156px); aspect-ratio: 1 / 1">
<svg viewBox="0 0 160 160" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%">
<defs>
<linearGradient id="rpgold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6DE97"/><stop offset="0.5" stop-color="#B98A3A"/><stop offset="1" stop-color="#F2D78C"/></linearGradient>
<radialGradient id="rpfill" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#222222"/><stop offset="1" stop-color="#050505"/></radialGradient>
</defs>
<circle cx="80" cy="80" r="77" fill="url(#rpfill)" stroke="url(#rpgold)" stroke-width="2.4"/>
<circle cx="80" cy="80" r="69" fill="none" stroke="url(#rpgold)" stroke-width="0.9" opacity="0.7"/>
<circle cx="80" cy="3" r="2.2" fill="#F2D78C"/>
<circle cx="80" cy="157" r="2.2" fill="#F2D78C"/>
</svg>
<img src="8d5605ab82d7656d7c5ab0487f0dde1c.png" alt="RP monogram" style="position: absolute; left: 50%; top: 50%; height: 62%; width: auto; transform: translate(-50%, -50%)">
</div>
<div aria-hidden="true" style="flex: none; width: 1px; height: clamp(40px, 6vw, 64px); background: linear-gradient(180deg, rgba(242,215,140,0), rgba(242,215,140,0.8), rgba(242,215,140,0))"></div>
<img src="cbaa8357ee0e737e7bfb1f0ea6cfa8a4.png" alt="Regis Point" style="height: clamp(26px, 6vw, 60px); width: auto; flex: none">
</div>
<div style="font-size: 15px; font-weight: 600; letter-spacing: 0.26em; color: #F2B544">{{t.eyebrow}}</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(48px, 6.2vw, 96px); line-height: 0.95; letter-spacing: -0.03em; color: #F6EBD9; text-wrap: balance">{{t.h1a}} <span style="font-style: italic; font-weight: 500; color: #F2B544">{{t.h1b}}</span></h1>
<p style="margin: 0; max-width: 540px; font-size: 22px; line-height: 1.5; color: #F6EBD9; text-wrap: pretty">{{t.heroSub}}</p>
<div style="display: flex; flex-direction: column; gap: 18px; max-width: 560px; padding: 28px 30px 30px 30px; background: #F6EBD9; color: #0B0B0B">
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1.05">{{t.heroQ}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="{{t.heroQ}}">
<sc-for list="{{guestChips}}" as="x" hint-placeholder-count="7">
<button onClick="{{x.pick}}" aria-pressed="{{x.on}}" style="width: 52px; height: 52px; border-radius: 50%; cursor: pointer; font-size: 20px; font-weight: 600; border: 1.5px solid #0B0B0B; background: {{x.bg}}; color: {{x.fg}}">{{x.label}}</button>
</sc-for>
</div>
<div style="font-size: 16px; line-height: 1.4">{{heroHint}}</div>
<a class="btn" href="#menu" style="display: inline-flex; align-items: center; justify-content: center; min-height: 58px; padding: 0 30px; border-radius: 999px; background: #0B0B0B; color: #F6EBD9; font-size: 18px; font-weight: 600; text-decoration: none; text-align: center">{{t.heroSee}}</a>
</div>
</div>

<div class="heroimg" style="position: relative; flex: 1 1 440px; max-width: 520px; margin: 0 auto; min-width: 0; height: 700px; align-self: flex-end">
<div style="position: absolute; left: 50%; bottom: 0; width: 440px; max-width: 88%; aspect-ratio: 440 / 670; transform: translateX(-50%); filter: drop-shadow(0 24px 32px rgba(0,0,0,0.4))">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 999px 999px 0 0; background: linear-gradient(90deg, #C9A872 0%, #E9D5AF 28%, #EFDDB8 50%, #E9D5AF 72%, #C4A06B 100%)"></div>
<div class="arch" style="position: absolute; left: 5%; right: 5%; top: 3.28%; bottom: 0; border-radius: 999px 999px 0 0; overflow: hidden; background: #222222">
<img class="pic" src="a956ec1169e84b030d7ccd24a7a933b9.jpg" alt="Columbus statue and the Zona Colonial at sunset" style="position: absolute; left: -39.6%; top: -4.8%; width: 140%; height: auto; max-width: none">
</div>
<svg viewBox="0 0 440 670" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none">
<polygon points="194.2,23.7 191.3,1.9 248.7,1.9 245.8,23.7" fill="#C9A66F"/>
<path d="M28.7 168.8L7.5 163.1M48.5 121.0L29.5 110.0M80.0 80.0L64.4 64.4M121.0 48.5L110.0 29.5M168.8 28.7L163.1 7.5M271.2 28.7L276.9 7.5M319.0 48.5L330.0 29.5M360.0 80.0L375.6 64.4M391.5 121.0L410.5 110.0M411.3 168.8L432.5 163.1M168.8 28.7L163.1 7.5M271.2 28.7L276.9 7.5" stroke="#9C7C4A" stroke-width="1.6" fill="none"/>
<path d="M0 275H22M418 275H440M0 330H22M418 330H440M0 385H22M418 385H440M0 440H22M418 440H440M0 495H22M418 495H440M0 550H22M418 550H440M0 605H22M418 605H440M0 660H22M418 660H440" stroke="#9C7C4A" stroke-width="1.6" fill="none"/>
<path d="M22 670V220A198 198 0 0 1 418 220V670" fill="none" stroke="#5A4120" stroke-opacity="0.55" stroke-width="3"/>
<path d="M1 670V220A219 219 0 0 1 439 220V670" fill="none" stroke="#F6E7C6" stroke-width="2"/>
</svg>
<div style="position: absolute; left: -44px; top: 150px; width: 132px; height: 132px; border-radius: 50%; background: #F2B544; color: #0B0B0B; display: flex; align-items: center; justify-content: center; padding: 18px; text-align: center; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 19px; line-height: 1.1">{{t.badge}}</div>
</div>
</div>

</div>
</div>
</header>

<section id="menu" style="background: #0B0B0B; color: #F6EBD9">
<div style="max-width: 1280px; margin: 0 auto; padding: 24px 20px 80px 20px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(36px, 5vw, 64px); line-height: 1; letter-spacing: -0.02em">{{t.menuTitle}}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.45; color: #F6EBD9">{{t.menuSub}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px">
<button class="tile" onClick="{{goTransfers}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 236px; padding: 38px 12px 22px 12px; border: 1.5px solid rgba(242,181,68,0.6); border-radius: 999px 999px 20px 20px; background: linear-gradient(180deg, #1B1B1B, #0F0F0F); color: #F6EBD9; cursor: pointer; text-align: center">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#F2B544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4 C26.5 4 27.5 7 27.5 11 V19 L44 29 V33 L27.5 28.5 V38 L32 41.5 V44 L24 42 L16 44 V41.5 L20.5 38 V28.5 L4 33 V29 L20.5 19 V11 C20.5 7 21.5 4 24 4 Z"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.05">{{t.tileAirport}}</span>
<span style="display: block; min-height: 37px; font-size: 14px; line-height: 1.3; font-weight: 500; color: #F2B544">{{tileSub.airport}}</span>
</button>
<button class="tile" onClick="{{goBeaches}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 236px; padding: 38px 12px 22px 12px; border: 1.5px solid rgba(242,181,68,0.6); border-radius: 999px 999px 20px 20px; background: linear-gradient(180deg, #1B1B1B, #0F0F0F); color: #F6EBD9; cursor: pointer; text-align: center">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#F2B544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="10" r="4.5"/><path d="M23 40 C23 31 25 23 30 15"/><path d="M30 15 C25 9 17 10 12 16 M30 15 C31 8 37 5 43 7 M30 15 C36 12 43 15 45 21 M30 15 C26 17 21 21 19 27"/><path d="M3 41 Q7.5 37.5 12 41 T21 41 T30 41 T39 41 T47 41"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.05">{{t.tileBeaches}}</span>
<span style="display: block; min-height: 37px; font-size: 14px; line-height: 1.3; font-weight: 500; color: #F2B544">{{tileSub.beaches}}</span>
</button>
<button class="tile" onClick="{{goTours}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 236px; padding: 38px 12px 22px 12px; border: 1.5px solid rgba(242,181,68,0.6); border-radius: 999px 999px 20px 20px; background: linear-gradient(180deg, #1B1B1B, #0F0F0F); color: #F6EBD9; cursor: pointer; text-align: center">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#F2B544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><circle cx="24" cy="24" r="2"/><path d="M31 17 L27 27 L17 31 L21 21 Z"/><path d="M24 5 V9 M24 39 V43 M5 24 H9 M39 24 H43"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.05">{{t.tileTours}}</span>
<span style="display: block; min-height: 37px; font-size: 14px; line-height: 1.3; font-weight: 500; color: #F2B544">{{tileSub.tours}}</span>
</button>
<button class="tile" onClick="{{goCooking}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 236px; padding: 38px 12px 22px 12px; border: 1.5px solid rgba(242,181,68,0.6); border-radius: 999px 999px 20px 20px; background: linear-gradient(180deg, #1B1B1B, #0F0F0F); color: #F6EBD9; cursor: pointer; text-align: center">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#F2B544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 31 C8.5 31 6 23 12 20.5 C11 13 20 9.5 24 14 C28 9.5 37 13 36 20.5 C42 23 39.5 31 33 31 Z"/><path d="M15 31 V41 H33 V31"/><path d="M20 35 H28"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.05">{{t.tileCooking}}</span>
<span style="display: block; min-height: 37px; font-size: 14px; line-height: 1.3; font-weight: 500; color: #F2B544">{{tileSub.cooking}}</span>
</button>
<button class="tile" onClick="{{goSpa}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 236px; padding: 38px 12px 22px 12px; border: 1.5px solid rgba(242,181,68,0.6); border-radius: 999px 999px 20px 20px; background: linear-gradient(180deg, #1B1B1B, #0F0F0F); color: #F6EBD9; cursor: pointer; text-align: center">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#F2B544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7 C30 14 30 26 24 33 C18 26 18 14 24 7 Z"/><path d="M24 33 C16 32 9.5 27 8 18 C15.5 18 21.5 23 24 33 Z"/><path d="M24 33 C32 32 38.5 27 40 18 C32.5 18 26.5 23 24 33 Z"/><path d="M11 38 Q17.5 35 24 38 T37 38"/><path d="M15 43 H33"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.05">{{t.tileSpa}}</span>
<span style="display: block; min-height: 37px; font-size: 14px; line-height: 1.3; font-weight: 500; color: #F2B544">{{tileSub.spa}}</span>
</button>
<button class="tile" onClick="{{goCheckin}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 236px; padding: 38px 12px 22px 12px; border: 1.5px solid rgba(242,181,68,0.6); border-radius: 999px 999px 20px 20px; background: linear-gradient(180deg, #1B1B1B, #0F0F0F); color: #F6EBD9; cursor: pointer; text-align: center">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#F2B544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="26" r="16"/><path d="M24 16 V26 L31 30"/><path d="M19 5 H29"/><path d="M6 8 L11 12 M42 8 L37 12"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.05">{{t.tileCheckin}}</span>
<span style="display: block; min-height: 37px; font-size: 14px; line-height: 1.3; font-weight: 500; color: #F2B544">{{tileSub.checkin}}</span>
</button>
<button class="tile" onClick="{{goPackages}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 236px; padding: 38px 12px 22px 12px; border: 1.5px solid rgba(242,181,68,0.6); border-radius: 999px 999px 20px 20px; background: linear-gradient(180deg, #1B1B1B, #0F0F0F); color: #F6EBD9; cursor: pointer; text-align: center">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#F2B544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="21" width="34" height="21"/><rect x="5" y="14" width="38" height="7"/><path d="M24 14 V42"/><path d="M24 14 C19 4 10 7 15 13 M24 14 C29 4 38 7 33 13"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.05">{{t.tilePackages}}</span>
<span style="display: block; min-height: 37px; font-size: 14px; line-height: 1.3; font-weight: 500; color: #F2B544">{{tileSub.packages}}</span>
</button>
<button class="tile" onClick="{{goPlan}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 236px; padding: 38px 12px 22px 12px; border: 1.5px solid rgba(242,181,68,0.6); border-radius: 999px 999px 20px 20px; background: linear-gradient(180deg, #1B1B1B, #0F0F0F); color: #F6EBD9; cursor: pointer; text-align: center">
<svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true" fill="none" stroke="#F2B544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="32" height="32" rx="3"/><path d="M8 18 H40"/><path d="M16 5 V12 M32 5 V12"/><path d="M17 29 L22 34 L31 24"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.05">{{t.tilePlan}}</span>
<span style="display: block; min-height: 37px; font-size: 14px; line-height: 1.3; font-weight: 500; color: #F2B544">{{tileSub.plan}}</span>
</button>
</div>
</div>
</section>
</sc-if>


<!-- TOP BAR -->
<sc-if value="{{showBar}}" hint-placeholder-val="{{false}}">
<div style="position: sticky; top: 0; z-index: 30; background: #0B0B0B; border-bottom: 1px solid rgba(242,181,68,0.45)">
<div style="max-width: 1280px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<button onClick="{{goHome}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #F2B544; background: transparent; color: #F2B544; font-size: 15px; font-weight: 600; cursor: pointer">&larr; {{t.backMenu}}</button>
<div style="display: flex; align-items: center; gap: 8px">
<button onClick="{{goGuestCI}}" style="min-height: 44px; padding: 0 14px; border: 2.5px solid #F2B544; border-radius: 6px; background: transparent; color: #F6EBD9; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">{{t.tabGC}}</button>
<div style="display: flex; align-items: center; gap: 2px; padding: 3px; border: 1.5px solid rgba(246,235,217,0.4); border-radius: 999px">
<button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-height: 36px; min-width: 40px; border: 0; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; background: {{enBg}}; color: {{enFg}}">EN</button>
<button onClick="{{setEs}}" aria-pressed="{{isEs}}" style="min-height: 36px; min-width: 40px; border: 0; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; background: {{esBg}}; color: {{esFg}}">ES</button>
</div>
<button onClick="{{goPlan}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #F2B544; color: #0B0B0B; font-size: 15px; font-weight: 600; cursor: pointer">{{planBtn}}</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isTransfers}}" hint-placeholder-val="{{false}}">
<!-- TRANSFERS -->
<section id="transfers" class="scr" style="background: #F6EBD9; color: #0B0B0B">
<div style="max-width: 1280px; margin: 0 auto; padding: 104px 32px 120px 32px; display: flex; flex-direction: column; gap: 56px">

<div style="display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-end; justify-content: space-between">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 20px">
<div style="font-size: 15px; font-weight: 600; letter-spacing: 0.26em; color: #8A2F1C">01 · {{t.tEyebrow}}</div>
